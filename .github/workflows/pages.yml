name: Publish walkthrough
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  actions: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - name: Wait for artifact metadata
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for attempt in {1..15}; do
            count=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/artifacts" --jq '[.artifacts[] | select(.name == "github-pages")] | length')
            if [ "$count" -gt 0 ]; then exit 0; fi
            sleep 2
          done
          echo "Pages artifact metadata did not become available"
          exit 1
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
